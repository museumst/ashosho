<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>게시판</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f4f4f2;
      --surface: #ffffff;
      --line:    #e4e4e0;
      --text:    #1a1a18;
      --muted:   #888880;
      --accent:  #4f8ef7;
      --danger:  #e53e3e;
      --radius:  12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; padding-bottom: 60px;
    }

    /* ── header ── */
    header {
      background: var(--surface); border-bottom: 1px solid var(--line);
      padding: 14px 20px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .hd-back { font-size: .85rem; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 4px; }
    .hd-back:hover { color: var(--text); }
    .hd-title { font-size: 1rem; font-weight: 800; }
    .hd-auth  { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    /* ── auth ── */
    [hidden] { display: none !important; }
    .auth-login-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--surface);
      font: inherit; font-size: .82rem; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }
    .auth-login-btn:hover { border-color: var(--accent); }
    .auth-user  { display: flex; align-items: center; gap: 8px; }
    .auth-avatar { width: 28px; height: 28px; border-radius: 50%; }
    .auth-name  { font-size: .82rem; font-weight: 700; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .auth-logout-btn {
      padding: 5px 10px; border-radius: 7px;
      border: 1px solid var(--line); background: transparent;
      font: inherit; font-size: .78rem; cursor: pointer; color: var(--muted);
    }
    .auth-logout-btn:hover { color: var(--text); border-color: var(--text); }

    /* ── layout ── */
    .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px; }

    /* ── write form ── */
    .write-box {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px; margin-bottom: 28px;
    }
    .write-box h2 { font-size: .95rem; font-weight: 800; margin-bottom: 14px; }
    .write-login-hint { font-size: .85rem; color: var(--muted); padding: 14px 0; text-align: center; }
    textarea {
      width: 100%; min-height: 100px; padding: 12px;
      border: 1px solid var(--line); border-radius: 9px;
      background: var(--bg); color: var(--text);
      font: inherit; font-size: .9rem; resize: vertical; margin-bottom: 12px;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .submit-row { display: flex; justify-content: flex-end; }
    .btn-submit {
      padding: 9px 22px; border-radius: 9px;
      border: none; background: var(--accent); color: #fff;
      font: inherit; font-size: .9rem; font-weight: 800;
      cursor: pointer; transition: opacity .15s;
    }
    .btn-submit:disabled { opacity: .4; cursor: default; }
    .btn-submit:not(:disabled):hover { opacity: .85; }

    /* ── toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1a1a18; color: #fff; padding: 10px 22px;
      border-radius: 30px; font-size: .88rem; font-weight: 700;
      opacity: 0; pointer-events: none; transition: opacity .25s;
      white-space: nowrap; z-index: 100;
    }
    .toast.show { opacity: 1; }

    /* ── post list ── */
    .list-header { font-size: .8rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
    .post-list { display: grid; gap: 10px; }
    .post { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .post-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .post-avatar { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; }
    .post-name { font-size: .8rem; font-weight: 700; }
    .post-date { font-size: .75rem; color: var(--muted); margin-left: auto; }
    .post-actions { display: flex; gap: 6px; }
    .btn-edit, .btn-delete {
      padding: 3px 10px; border-radius: 6px; font: inherit;
      font-size: .75rem; font-weight: 700; cursor: pointer; border: 1px solid var(--line);
      background: transparent; color: var(--muted); transition: .15s;
    }
    .btn-edit:hover   { border-color: var(--accent); color: var(--accent); }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); }
    .post-content { font-size: .9rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }

    /* ── inline edit ── */
    .inline-edit { display: grid; gap: 8px; margin-top: 10px; }
    .inline-edit textarea { margin-bottom: 0; min-height: 80px; }
    .inline-edit-btns { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-save {
      padding: 6px 16px; border-radius: 7px; border: none;
      background: var(--accent); color: #fff;
      font: inherit; font-size: .82rem; font-weight: 700; cursor: pointer;
    }
    .btn-cancel {
      padding: 6px 16px; border-radius: 7px;
      border: 1px solid var(--line); background: transparent;
      font: inherit; font-size: .82rem; cursor: pointer; color: var(--muted);
    }

    .empty { text-align: center; color: var(--muted); font-size: .9rem; padding: 40px 0; }
    .loading { text-align: center; color: var(--muted); font-size: .88rem; padding: 30px 0; }
  </style>
</head>
<body>

<header>
  <a class="hd-back" href="../../index.html">← 홈</a>
  <span class="hd-title">게시판</span>
  <div class="hd-auth">
    <button class="auth-login-btn" id="btn-login" hidden>
      <svg width="14" height="14" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.5 33.7 29.8 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.8 0 20-7.8 20-21 0-1.4-.1-2.7-.5-4z"/>
        <path fill="#34A853" d="M6.3 14.7l7 5.1C15 16.1 19.1 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3c-7.7 0-14.4 4.4-17.7 11.7z"/>
        <path fill="#FBBC05" d="M24 45c5.5 0 10.5-1.9 14.4-5l-6.7-5.5C29.6 36 26.9 37 24 37c-5.8 0-10.5-3.3-11.8-8.4l-7 5.4C8.1 40.8 15.5 45 24 45z"/>
        <path fill="#EA4335" d="M44.5 20H24v8.5h11.8c-.6 2.8-2.3 5.1-4.7 6.6l6.7 5.5C41.8 37.3 45 31.1 45 24c0-1.4-.2-2.7-.5-4z"/>
      </svg>
      Google로 로그인
    </button>
    <div class="auth-user" id="auth-user" hidden>
      <img class="auth-avatar" id="auth-avatar" alt="" referrerpolicy="no-referrer" hidden />
      <span class="auth-name" id="auth-name"></span>
      <button class="auth-logout-btn" id="btn-logout">로그아웃</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="write-box">
    <h2>건의사항 및 오류 제보</h2>
    <div id="write-login-hint" class="write-login-hint">로그인 후 글을 남길 수 있습니다.</div>
    <div id="write-form" hidden>
      <textarea id="content-input" placeholder="내용을 입력하세요..." maxlength="1000"></textarea>
      <div class="submit-row">
        <button class="btn-submit" id="btn-submit">등록</button>
      </div>
    </div>
  </div>

  <div class="list-header">게시글</div>
  <div class="post-list" id="post-list">
    <div class="loading">불러오는 중...</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }         from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  getFirestore,
  collection, addDoc, getDocs, updateDoc, deleteDoc, doc,
  query, orderBy, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const ADMIN_EMAIL = 'museumst@gmail.com';

const firebaseConfig = {
  apiKey:            'AIzaSyC-CfCYCaNa3--RTXChQIY7c-EVURyuO1I',
  authDomain:        'grayrockclub-51ed3.firebaseapp.com',
  projectId:         'grayrockclub-51ed3',
  storageBucket:     'grayrockclub-51ed3.firebasestorage.app',
  messagingSenderId: '1014728880013',
  appId:             '1:1014728880013:web:ad27fb41c8834c870c97c4',
};

const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const db       = getFirestore(app);
const col      = collection(db, 'feedback');
const provider = new GoogleAuthProvider();

const btnLogin   = document.getElementById('btn-login');
const btnLogout  = document.getElementById('btn-logout');
const authUser   = document.getElementById('auth-user');
const authAvatar = document.getElementById('auth-avatar');
const authName   = document.getElementById('auth-name');
const writeHint  = document.getElementById('write-login-hint');
const writeForm  = document.getElementById('write-form');
const contentEl  = document.getElementById('content-input');
const btnSubmit  = document.getElementById('btn-submit');
const postList   = document.getElementById('post-list');
const toastEl    = document.getElementById('toast');

let currentUser = null;

// ── toast ──
let _toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function isAdmin(user) {
  return user && user.email === ADMIN_EMAIL;
}

function canEdit(user, post) {
  return user && user.uid === post.uid;
}

function canDelete(user, post) {
  return user && (user.uid === post.uid || isAdmin(user));
}

// ── auth ──
onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    if (user.photoURL) { authAvatar.src = user.photoURL; authAvatar.hidden = false; }
    else authAvatar.hidden = true;
    authName.textContent = user.displayName || user.email || '사용자';
    authUser.hidden  = false;
    btnLogin.hidden  = true;
    writeHint.hidden = true;
    writeForm.hidden = false;
  } else {
    authAvatar.hidden = true;
    authUser.hidden   = true;
    btnLogin.hidden   = false;
    writeHint.hidden  = false;
    writeForm.hidden  = true;
  }
  loadPosts();
});

btnLogin.addEventListener('click', () => signInWithPopup(auth, provider).catch(console.error));
btnLogout.addEventListener('click', () => signOut(auth).catch(console.error));

// ── 등록 ──
btnSubmit.addEventListener('click', async () => {
  if (!currentUser) return;
  const text = contentEl.value.trim();
  if (!text) { showToast('내용을 입력하세요.'); return; }
  btnSubmit.disabled = true;
  try {
    await addDoc(col, {
      uid:         currentUser.uid,
      displayName: currentUser.displayName || currentUser.email || '익명',
      photoURL:    currentUser.photoURL || '',
      content:     text,
      createdAt:   serverTimestamp(),
    });
    contentEl.value = '';
    showToast('등록됐습니다. 감사합니다!');
    loadPosts();
  } catch(e) {
    showToast('등록에 실패했습니다: ' + e.message);
  } finally {
    btnSubmit.disabled = false;
  }
});

// ── 유틸 ──
function formatDate(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 목록 ──
let _posts = []; // { id, data }

async function loadPosts() {
  try {
    const snap = await getDocs(query(col, orderBy('createdAt', 'desc')));
    _posts = snap.docs.map(d => ({ id: d.id, data: d.data() }));
    renderPosts();
  } catch(e) {
    postList.innerHTML = `<div class="empty">불러오기 실패: ${esc(e.message)}</div>`;
  }
}

function renderPosts() {
  if (!_posts.length) {
    postList.innerHTML = '<div class="empty">아직 게시글이 없습니다.</div>';
    return;
  }
  postList.innerHTML = _posts.map(({ id, data: p }) => {
    const avatar = p.photoURL
      ? `<img class="post-avatar" src="${esc(p.photoURL)}" alt="" referrerpolicy="no-referrer" />`
      : `<span class="post-avatar" style="background:var(--line);display:inline-block;"></span>`;
    const editBtn   = canEdit(currentUser, p)   ? `<button class="btn-edit"   data-id="${esc(id)}">수정</button>` : '';
    const deleteBtn = canDelete(currentUser, p) ? `<button class="btn-delete" data-id="${esc(id)}">삭제</button>` : '';
    const actions = (editBtn || deleteBtn) ? `<div class="post-actions">${editBtn}${deleteBtn}</div>` : '';
    return `
      <div class="post" data-id="${esc(id)}">
        <div class="post-meta">
          ${avatar}
          <span class="post-name">${esc(p.displayName)}</span>
          <span class="post-date">${formatDate(p.createdAt)}</span>
          ${actions}
        </div>
        <div class="post-content" data-content-id="${esc(id)}">${esc(p.content)}</div>
      </div>`;
  }).join('');
}

// ── 수정 / 삭제 (이벤트 위임) ──
postList.addEventListener('click', async e => {
  // 삭제
  if (e.target.matches('.btn-delete')) {
    const id = e.target.dataset.id;
    if (!confirm('이 글을 삭제할까요?')) return;
    try {
      await deleteDoc(doc(db, 'feedback', id));
      showToast('삭제됐습니다.');
      loadPosts();
    } catch(err) {
      showToast('삭제 실패: ' + err.message);
    }
    return;
  }

  // 수정 — 인라인 편집창 열기
  if (e.target.matches('.btn-edit')) {
    const id = e.target.dataset.id;
    const postEl = postList.querySelector(`.post[data-id="${id}"]`);
    if (!postEl) return;
    // 이미 열려있으면 닫기
    if (postEl.querySelector('.inline-edit')) return;
    const contentEl = postEl.querySelector('.post-content');
    const original = _posts.find(p => p.id === id)?.data.content || '';
    contentEl.insertAdjacentHTML('afterend', `
      <div class="inline-edit">
        <textarea class="edit-textarea">${esc(original)}</textarea>
        <div class="inline-edit-btns">
          <button class="btn-cancel" data-cancel="${esc(id)}">취소</button>
          <button class="btn-save"   data-save="${esc(id)}">저장</button>
        </div>
      </div>`);
    postEl.querySelector('.edit-textarea').focus();
    return;
  }

  // 수정 취소
  if (e.target.matches('.btn-cancel')) {
    const id = e.target.dataset.cancel;
    postList.querySelector(`.post[data-id="${id}"] .inline-edit`)?.remove();
    return;
  }

  // 수정 저장
  if (e.target.matches('.btn-save')) {
    const id = e.target.dataset.save;
    const postEl = postList.querySelector(`.post[data-id="${id}"]`);
    const newText = postEl.querySelector('.edit-textarea')?.value.trim();
    if (!newText) { showToast('내용을 입력하세요.'); return; }
    e.target.disabled = true;
    try {
      await updateDoc(doc(db, 'feedback', id), { content: newText, updatedAt: serverTimestamp() });
      showToast('수정됐습니다.');
      loadPosts();
    } catch(err) {
      showToast('수정 실패: ' + err.message);
      e.target.disabled = false;
    }
  }
});
</script>
</body>
</html>
