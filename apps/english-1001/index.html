<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1001영어문장</title>
    <link rel="stylesheet" href="../../assets/styles.css" />
    <style>
      .sentence-app {
        align-items: start;
        padding: 16px;
      }

      .access-panel {
        width: min(460px, 100%);
      }

      .access-panel h1 {
        max-width: none;
      }

      .sentence-panel {
        width: min(860px, 100%);
      }

      .sentence-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      .sentence-head h1 {
        margin: 0;
        max-width: none;
        font-size: clamp(2rem, 6vw, 3.3rem);
        line-height: 1.05;
      }

      .sentence-meta {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 800;
      }

      .top-actions,
      .sentence-tools,
      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .icon-btn,
      .plain-btn,
      .tts-btn {
        display: inline-grid;
        min-height: 40px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 0.88rem;
        font-weight: 800;
      }

      .icon-btn {
        width: 44px;
        padding: 0;
      }

      .plain-btn {
        padding: 0 14px;
      }

      .tts-btn {
        width: 34px;
        min-height: 34px;
      }

      .hide-english-btn.is-active {
        border-color: #202124;
        background: #202124;
        color: #fff;
      }

      .note-btn.has-note {
        border-color: #f97316;
        background: #fff0df;
        color: #b54708;
      }

      .note-btn.has-note:hover,
      .note-btn.has-note:focus-visible {
        border-color: #c2410c;
        background: #ffe0bd;
        color: #9a3412;
      }

      .icon-btn:hover,
      .icon-btn:focus-visible,
      .plain-btn:hover,
      .plain-btn:focus-visible,
      .tts-btn:hover,
      .tts-btn:focus-visible {
        border-color: var(--accent);
        background: #e8f4f2;
        color: var(--accent-strong);
        outline: none;
      }

      .icon-btn svg,
      .tts-btn svg {
        width: 18px;
        height: 18px;
      }

      .icon-btn.is-active {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .tts-btn:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      .plain-btn:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      .sentence-tools {
        margin-top: 22px;
      }

      .sentence-search,
      .chapter-select,
      .jump-input {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 0.95rem;
      }

      .sentence-search {
        flex: 1 1 240px;
        min-width: 0;
        padding: 0 12px;
      }

      .chapter-select {
        min-width: min(100%, 245px);
        padding: 0 34px 0 12px;
      }

      .jump-input {
        width: 92px;
        padding: 0 10px;
      }

      .status {
        min-height: 22px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 800;
        line-height: 1.45;
      }

      .card-list {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .sentence-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: #fbfcfb;
      }

      .card-number {
        color: var(--accent-strong);
        font-size: 0.78rem;
        font-weight: 900;
      }

      .english-line {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-top: 8px;
      }

      .english-text {
        margin: 0;
        flex: 1 1 auto;
        min-width: 0;
        color: var(--text);
        font-size: clamp(1.05rem, 4vw, 1.28rem);
        font-weight: 900;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .pattern-badge {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--accent-strong);
        opacity: 0.7;
        vertical-align: middle;
        white-space: nowrap;
      }

      .sentence-card.is-hidden .english-text {
        min-height: 1.55em;
        border-radius: 2px;
        background: #101010;
        color: #101010;
        text-shadow: none;
        user-select: none;
      }

      .korean-text {
        margin: 12px 0 0;
        color: #31423f;
        font-size: 1rem;
        font-weight: 800;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }

      .korean-text.empty {
        color: var(--muted);
      }

      .empty-state {
        margin-top: 16px;
      }

      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 18px;
      }

      .pagination-status {
        min-width: 94px;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 800;
        text-align: center;
      }

      .note-dialog {
        width: min(540px, calc(100% - 32px));
        min-width: min(360px, calc(100% - 32px));
        min-height: 340px;
        max-width: calc(100% - 32px);
        max-height: min(620px, calc(100dvh - 32px));
        box-sizing: border-box;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 18px 54px rgba(17, 24, 39, 0.2);
        resize: both;
        overflow: auto;
      }

      .note-dialog::backdrop {
        background: rgba(17, 24, 39, 0.42);
      }

      .note-dialog-body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 16px;
        min-height: 338px;
        height: 100%;
        box-sizing: border-box;
        padding: 20px;
      }

      .note-dialog-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .note-dialog-title {
        margin: 0;
        font-size: 1.15rem;
      }

      .note-context {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 700;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .note-input {
        width: 100%;
        min-height: 0;
        height: 100%;
        resize: none;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfb;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        line-height: 1.6;
      }

      .note-input:focus {
        border-color: var(--accent);
        outline: 2px solid rgba(15, 118, 110, 0.16);
        outline-offset: 1px;
      }

      .note-dialog-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 640px) {
        .sentence-app {
          padding: 10px;
        }

        .sentence-panel {
          padding: 18px;
        }

        .sentence-head {
          display: grid;
        }

        .top-actions {
          justify-content: flex-start;
        }

        .sentence-tools {
          display: grid;
          grid-template-columns: 1fr 92px;
        }

        .sentence-search {
          grid-column: 1 / -1;
        }

        .chapter-select {
          grid-column: 1 / -1;
          width: 100%;
        }

        .plain-btn {
          min-height: 42px;
        }
      }
    </style>
  </head>
  <body class="mini-app sentence-app">
    <section class="mini-app-panel access-panel" id="access-panel" aria-live="polite" hidden>
      <p class="eyebrow">Private</p>
      <h1>1001영어문장</h1>
      <p class="sentence-meta" id="access-message">관리자 계정으로 로그인하면 이용할 수 있습니다.</p>
      <button class="primary-button" id="access-login" type="button">Google로 로그인</button>
      <label id="access-import" hidden>
        내 계정에 원본 백업 가져오기
        <input id="original-file" type="file" accept=".json,application/json" />
      </label>
    </section>

    <main class="mini-app-panel sentence-panel" id="sentence-content" hidden>
      <header class="sentence-head">
        <div>
          <p class="eyebrow">Study</p>
          <h1>1001영어문장</h1>
          <p class="sentence-meta" id="sentence-meta">1001개 문장</p>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" id="toggle-english" aria-label="영어문장 가리기" title="영어문장 가리기">
            <i data-lucide="eye"></i>
          </button>
        </div>
      </header>

      <div class="sentence-tools">
        <select class="chapter-select" id="chapter-select" aria-label="학습 범위 선택"></select>
        <input class="sentence-search" id="search-input" type="search" placeholder="문장 검색" />
        <input class="jump-input" id="jump-input" type="number" min="1" placeholder="번호" aria-label="문장 번호" />
        <button class="plain-btn" type="button" id="jump-button">이동</button>
      </div>

      <p class="status" id="status-line" aria-live="polite"></p>
      <section class="card-list" id="card-list" aria-label="영어 문장 카드"></section>
      <div class="empty-state" id="empty-state" hidden>표시할 문장이 없습니다.</div>
      <nav class="pagination" id="pagination" aria-label="문장 페이지">
        <button class="plain-btn" type="button" id="previous-page">이전</button>
        <span class="pagination-status" id="page-status"></span>
        <button class="plain-btn" type="button" id="next-page">다음</button>
      </nav>
    </main>

    <dialog class="note-dialog" id="note-dialog" aria-labelledby="note-dialog-title">
      <div class="note-dialog-body">
        <header class="note-dialog-head">
          <div>
            <h2 class="note-dialog-title" id="note-dialog-title">문장 메모</h2>
            <p class="note-context" id="note-context"></p>
          </div>
          <button class="icon-btn" type="button" id="note-close" aria-label="메모 닫기" title="닫기">
            <i data-lucide="x"></i>
          </button>
        </header>
        <textarea class="note-input" id="note-input" placeholder="모르는 어휘, 문법, 기억할 내용을 적어보세요."></textarea>
        <div class="note-dialog-actions">
          <button class="icon-btn" type="button" id="note-delete" aria-label="메모 삭제" title="메모 삭제">
            <i data-lucide="trash-2"></i>
          </button>
          <button class="plain-btn" type="button" id="note-save">저장</button>
        </div>
      </div>
    </dialog>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>
      const PAGE_SIZE = 10;
      const isPractice = new URLSearchParams(location.search).get("set") === "practice";
      const storagePrefix = isPractice ? "ashosho-english-practice" : "ashosho-english-1001";
      const STORAGE_HIDE_KEY = `${storagePrefix}-hide-english`;
      const STORAGE_NOTES_KEY = `${storagePrefix}-notes`;
      const hasTts = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
      let sentences = [];
      let chapters = [];
      const chapterDefinitions = [
        { id: 1, title: "동사와 문장의 기본 구조", start: 1 },
        { id: 2, title: "주어의 이해", start: 72 },
        { id: 3, title: "목적어의 이해", start: 129 },
        { id: 4, title: "보어의 이해", start: 213 },
        { id: 5, title: "동사의 시제", start: 284 },
        { id: 6, title: "조동사", start: 333 },
        { id: 7, title: "동사의 태", start: 395 },
        { id: 8, title: "가정법", start: 445 },
        { id: 9, title: "수식어구: to부정사, 분사", start: 499 },
        { id: 10, title: "분사구문", start: 564 },
        { id: 11, title: "등위절과 병렬구조", start: 610 },
        { id: 12, title: "관계사절", start: 657 },
        { id: 13, title: "부사절", start: 736 },
        { id: 14, title: "전명구를 동반하는 동사구", start: 801 },
        { id: 15, title: "비교구문", start: 849 },
        { id: 16, title: "특수구문", start: 912 }
      ];

      const state = {
        query: "",
        chapterId: 1,
        page: 1,
        hideEnglish: localStorage.getItem(STORAGE_HIDE_KEY) === "true",
        hiddenSentenceNumbers: new Set(),
        revealedSentenceNumbers: new Set(),
        notes: loadNotes(),
        noteNumber: null
      };

      const els = {
        content: document.querySelector("#sentence-content"),
        access: document.querySelector("#access-panel"),
        accessMessage: document.querySelector("#access-message"),
        accessLogin: document.querySelector("#access-login"),
        accessImport: document.querySelector("#access-import"),
        originalFile: document.querySelector("#original-file"),
        meta: document.querySelector("#sentence-meta"),
        toggle: document.querySelector("#toggle-english"),
        chapter: document.querySelector("#chapter-select"),
        search: document.querySelector("#search-input"),
        jumpInput: document.querySelector("#jump-input"),
        jumpButton: document.querySelector("#jump-button"),
        status: document.querySelector("#status-line"),
        cardList: document.querySelector("#card-list"),
        empty: document.querySelector("#empty-state"),
        pagination: document.querySelector("#pagination"),
        previousPage: document.querySelector("#previous-page"),
        nextPage: document.querySelector("#next-page"),
        pageStatus: document.querySelector("#page-status"),
        noteDialog: document.querySelector("#note-dialog"),
        noteContext: document.querySelector("#note-context"),
        noteInput: document.querySelector("#note-input"),
        noteClose: document.querySelector("#note-close"),
        noteDelete: document.querySelector("#note-delete"),
        noteSave: document.querySelector("#note-save")
      };

      function esc(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function loadNotes() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_NOTES_KEY) || "{}");
          return saved && typeof saved === "object" && !Array.isArray(saved) ? saved : {};
        } catch {
          return {};
        }
      }

      function persistNotes() {
        if (Object.keys(state.notes).length === 0) {
          localStorage.removeItem(STORAGE_NOTES_KEY);
          return;
        }
        localStorage.setItem(STORAGE_NOTES_KEY, JSON.stringify(state.notes));
      }

      function hasNote(number) {
        return Boolean(state.notes[number]?.trim());
      }

      function selectedChapter() {
        return chapters.find((chapter) => chapter.id === state.chapterId) || null;
      }

      function scopedSentences() {
        const chapter = selectedChapter();
        if (!chapter) return sentences;
        return sentences.filter((item) => item.no >= chapter.start && item.no <= chapter.end);
      }

      function filteredSentences() {
        const query = state.query.trim().toLowerCase();
        const source = scopedSentences();
        if (!query) return source;
        return source.filter((item) => {
          return [item.no, item.en, item.ko]
            .join(" ")
            .toLowerCase()
            .includes(query);
        });
      }

      let ttsVoices = [];
      function loadVoices() {
        ttsVoices = window.speechSynthesis.getVoices();
      }
      if (hasTts) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }

      function pickVoice() {
        const voices = ttsVoices.length ? ttsVoices : window.speechSynthesis.getVoices();
        return (
          voices.find(v => v.name === "Google US English") ||
          voices.find(v => v.name.startsWith("Google") && v.lang === "en-US") ||
          voices.find(v => v.name.startsWith("Google") && v.lang.startsWith("en")) ||
          voices.find(v => !v.localService && v.lang.startsWith("en")) ||
          voices.find(v => v.name === "Samantha" || v.name === "Alex") ||
          voices.find(v => v.lang.startsWith("en")) ||
          null
        );
      }

      function speak(text) {
        if (!hasTts) {
          els.status.textContent = "이 브라우저에서는 TTS를 사용할 수 없습니다.";
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.92;
        const voice = pickVoice();
        if (voice) utterance.voice = voice;
        window.speechSynthesis.speak(utterance);
      }

      function updateEyeButton() {
        els.toggle.classList.toggle("is-active", state.hideEnglish);
        els.toggle.setAttribute("aria-label", state.hideEnglish ? "영어문장 보이기" : "영어문장 가리기");
        els.toggle.title = state.hideEnglish ? "영어문장 보이기" : "영어문장 가리기";
        els.toggle.innerHTML = `<i data-lucide="${state.hideEnglish ? "eye-off" : "eye"}"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }

      function isSentenceHidden(number) {
        return state.hideEnglish
          ? !state.revealedSentenceNumbers.has(number)
          : state.hiddenSentenceNumbers.has(number);
      }

      function renderChapterOptions() {
        els.chapter.innerHTML = [
          `<option value="all">전체 문장 (${sentences.length})</option>`,
          ...chapters.map((chapter) => `<option value="${chapter.id}">Chapter ${String(chapter.id).padStart(2, "0")} · ${chapter.title} (${chapter.start}-${chapter.end})</option>`)
        ].join("");
        els.chapter.value = state.chapterId || "all";
      }

      function render() {
        const filtered = filteredSentences();
        const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        state.page = Math.min(state.page, pageCount);
        const firstIndex = (state.page - 1) * PAGE_SIZE;
        const visible = filtered.slice(firstIndex, firstIndex + PAGE_SIZE);
        const chapter = selectedChapter();
        els.meta.textContent = `${sentences.length}개 문장`;
        els.status.textContent = state.query
          ? `${filtered.length}개 검색됨${chapter ? ` · Chapter ${String(chapter.id).padStart(2, "0")}` : ""}`
          : `${chapter ? `Chapter ${String(chapter.id).padStart(2, "0")} · ` : ""}${filtered.length}개 문장`;
        els.empty.hidden = visible.length > 0;
        els.pagination.hidden = filtered.length === 0;
        els.previousPage.disabled = state.page === 1;
        els.nextPage.disabled = state.page === pageCount;
        els.pageStatus.textContent = `${state.page} / ${pageCount}쪽`;
        els.cardList.innerHTML = visible.map((item) => `
          <article class="sentence-card ${isSentenceHidden(item.no) ? "is-hidden" : ""}" id="sentence-${item.no}">
            <span class="card-number">${item.no}</span>
            <div class="english-line">
              <p class="english-text">${esc(item.en)}${item.pattern ? ` <span class="pattern-badge">(${esc(item.pattern)})</span>` : ""}</p>
              <button class="tts-btn" type="button" data-speak="${esc(item.en)}" ${hasTts ? "" : "disabled"} aria-label="${item.no}번 영어문장 듣기" title="영어문장 듣기">
                <i data-lucide="volume-2"></i>
              </button>
              <button class="tts-btn note-btn ${hasNote(item.no) ? "has-note" : ""}" type="button" data-open-note="${item.no}" aria-label="${item.no}번 문장 메모" title="메모">
                <i data-lucide="notebook-pen"></i>
              </button>
              <button class="tts-btn hide-english-btn ${isSentenceHidden(item.no) ? "is-active" : ""}" type="button" data-toggle-sentence="${item.no}" aria-label="${item.no}번 영어문장 ${isSentenceHidden(item.no) ? "보이기" : "가리기"}" title="영어문장 ${isSentenceHidden(item.no) ? "보이기" : "가리기"}">
                <i data-lucide="${isSentenceHidden(item.no) ? "eye-off" : "eye"}"></i>
              </button>
            </div>
            <p class="korean-text ${item.ko ? "" : "empty"}">${item.ko ? esc(item.ko) : "한글 해석 준비 중"}</p>
          </article>
        `).join("");

        updateEyeButton();
      }

      function openNote(number) {
        const sentence = sentences.find((item) => item.no === number);
        if (!sentence) return;
        state.noteNumber = number;
        els.noteContext.textContent = `${number}번 · ${sentence.en}`;
        els.noteInput.value = state.notes[number] || "";
        els.noteDelete.disabled = !hasNote(number);
        els.noteDialog.showModal();
        requestAnimationFrame(() => els.noteInput.focus());
      }

      function closeNote() {
        if (els.noteDialog.open) els.noteDialog.close();
        state.noteNumber = null;
      }

      function saveNote() {
        const number = state.noteNumber;
        if (!number) return;
        const note = els.noteInput.value.trim();
        if (note) {
          state.notes[number] = note;
        } else {
          delete state.notes[number];
        }
        persistNotes();
        render();
        els.status.textContent = `${number}번 메모를 저장했습니다.`;
        closeNote();
      }

      function deleteNote() {
        const number = state.noteNumber;
        if (!number) return;
        delete state.notes[number];
        persistNotes();
        render();
        els.status.textContent = `${number}번 메모를 삭제했습니다.`;
        closeNote();
      }

      els.toggle.addEventListener("click", () => {
        state.hideEnglish = !state.hideEnglish;
        state.revealedSentenceNumbers.clear();
        localStorage.setItem(STORAGE_HIDE_KEY, String(state.hideEnglish));
        render();
      });

      els.search.addEventListener("input", () => {
        state.query = els.search.value;
        state.page = 1;
        render();
      });

      els.chapter.addEventListener("change", () => {
        state.chapterId = els.chapter.value === "all" ? null : Number(els.chapter.value);
        state.page = 1;
        render();
      });

      els.jumpButton.addEventListener("click", () => {
        const number = Number(els.jumpInput.value);
        if (!Number.isInteger(number) || number < 1 || number > sentences.length) {
          els.status.textContent = `1부터 ${sentences.length} 사이의 번호를 입력하세요.`;
          return;
        }
        const chapter = chapters.find((item) => number >= item.start && number <= item.end) || null;
        state.chapterId = chapter?.id || null;
        state.page = Math.floor((number - (chapter?.start || 1)) / PAGE_SIZE) + 1;
        state.query = "";
        els.search.value = "";
        renderChapterOptions();
        render();
        document.querySelector(`#sentence-${number}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      els.jumpInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") els.jumpButton.click();
      });

      els.noteClose.addEventListener("click", closeNote);
      els.noteSave.addEventListener("click", saveNote);
      els.noteDelete.addEventListener("click", deleteNote);
      els.noteDialog.addEventListener("close", () => {
        state.noteNumber = null;
      });

      document.addEventListener("click", (event) => {
        const noteButton = event.target.closest("[data-open-note]");
        if (noteButton) {
          openNote(Number(noteButton.dataset.openNote));
          return;
        }

        const hideButton = event.target.closest("[data-toggle-sentence]");
        if (hideButton) {
          const number = Number(hideButton.dataset.toggleSentence);
          const targetSet = state.hideEnglish ? state.revealedSentenceNumbers : state.hiddenSentenceNumbers;
          if (targetSet.has(number)) {
            targetSet.delete(number);
          } else {
            targetSet.add(number);
          }
          render();
          return;
        }

        const speakButton = event.target.closest("[data-speak]");
        if (speakButton) {
          speak(speakButton.dataset.speak);
          return;
        }
      });

      els.previousPage.addEventListener("click", () => {
        state.page -= 1;
        render();
        els.cardList.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      els.nextPage.addEventListener("click", () => {
        state.page += 1;
        render();
        els.cardList.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      function showCollection(rows, starts) {
        sentences = rows;
        chapters = chapterDefinitions.map((chapter, index) => ({
          ...chapter,
          start: starts[index],
          end: (starts[index + 1] ?? sentences.length + 1) - 1
        }));
        els.jumpInput.max = sentences.length;
        renderChapterOptions();
        render();
        els.access.hidden = true;
        els.content.hidden = false;
      }

      async function showPractice() {
        const title = "영어문장 1000";
        document.title = title;
        els.content.querySelector("h1").textContent = title;
        els.access.querySelector("h1").textContent = title;
        els.access.querySelector(".eyebrow").textContent = "Study";
        els.accessLogin.hidden = true;
        const { default: text } = await import("./practice.js?v=20261121");
        const starts = [];
        const rows = [];
        text.trim().split("\n\n").forEach((section, chapter) => {
          starts.push(rows.length + 1);
          section.split("\n").forEach((line, index) => {
            const [en, ko] = line.split("|");
            rows.push({ no: rows.length + 1, en, ko, pattern: chapter === 0 ? Math.floor(index / 20) + 1 : null });
          });
        });
        showCollection(rows, starts);
      }

      function isOriginalCollection(rows) {
        return Array.isArray(rows) && rows.length === 1001 && rows.every((row, index) =>
          row?.no === index + 1 && typeof row.en === "string" && row.en.trim() &&
          typeof row.ko === "string" && (row.pattern == null || [1, 2, 3, 4, 5].includes(row.pattern))
        );
      }

      async function showPrivate() {
        const adminEmail = "museumst@gmail.com";
        const cloudPath = "englishSentences/original";
        const { currentUser, loginWithGoogle, loadCloud, onAuthChange, saveCloud } = await import("../../assets/firebase-auth-default.js?v=20261118-admin-apps");
        const originalStarts = chapterDefinitions.map((chapter) => chapter.start);
        els.access.hidden = false;

        els.accessLogin.addEventListener("click", async () => {
          els.accessLogin.disabled = true;
          try {
            await loginWithGoogle();
          } catch {
            els.accessMessage.textContent = "로그인에 실패했습니다. 다시 시도해 주세요.";
          } finally {
            els.accessLogin.disabled = false;
          }
        });

        els.originalFile.addEventListener("change", async () => {
          const file = els.originalFile.files[0];
          const user = currentUser();
          if (!file || user?.email !== adminEmail || !user.emailVerified) return;
          els.originalFile.disabled = true;
          try {
            if (file.size > 1024 * 1024) throw new Error("Invalid backup size");
            const rows = JSON.parse(await file.text());
            if (!isOriginalCollection(rows)) throw new Error("Invalid backup format");
            if (currentUser()?.uid !== user.uid) return;
            const saved = await saveCloud(cloudPath, { rows: rows.map(({ no, en, ko, pattern }) => ({ no, en, ko, pattern: pattern ?? null })) });
            if (saved && currentUser()?.uid === user.uid) showCollection(rows, originalStarts);
          } catch {
            els.accessMessage.textContent = "백업을 가져오지 못했습니다. 원본 JSON 파일과 연결 상태를 확인해 주세요.";
          } finally {
            els.originalFile.value = "";
            els.originalFile.disabled = false;
          }
        });

        onAuthChange(async (user) => {
          closeNote();
          window.speechSynthesis?.cancel();
          sentences = [];
          els.cardList.replaceChildren();
          els.noteContext.textContent = "";
          els.noteInput.value = "";
          els.content.hidden = true;
          els.access.hidden = false;
          els.accessImport.hidden = true;
          const allowed = user?.email === adminEmail && user.emailVerified;
          els.accessLogin.hidden = Boolean(allowed);
          if (!allowed) {
            els.accessMessage.textContent = user ? "이 계정에는 접근 권한이 없습니다." : "관리자 계정으로 로그인하면 이용할 수 있습니다.";
            return;
          }
          els.accessMessage.textContent = "원본 문장을 불러오는 중입니다.";
          try {
            const data = await loadCloud(cloudPath);
            if (currentUser()?.uid !== user.uid) return;
            if (isOriginalCollection(data?.rows)) {
              showCollection(data.rows, originalStarts);
              return;
            }
            els.accessMessage.textContent = "처음 한 번 원본 백업 JSON을 선택해 주세요.";
            els.accessImport.hidden = false;
          } catch {
            if (currentUser()?.uid === user.uid) showLoadError();
          }
        }, showLoadError);
      }

      function showLoadError() {
        els.access.hidden = false;
        els.accessMessage.textContent = "문장을 불러오지 못했습니다. 페이지를 새로고침해 주세요.";
      }

      (isPractice ? showPractice() : showPrivate()).catch(showLoadError);
    </script>
  </body>
</html>
